name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# 같은 PR에 커밋을 연달아 푸시하면 이전 실행을 취소 (러너 시간 절약)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 의존성·빌드 캐시 자동 관리 (두 번째 실행부터 빨라짐)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test
        # ubuntu-latest 러너는 Docker 기본 탑재 → Testcontainers E2E가 그대로 동작

      # 실패 시 테스트 리포트를 아티팩트로 업로드 (Actions 탭에서 다운로드해 원인 확인)
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7

  # dev/main에 푸시될 때만, 그리고 테스트가 통과한 뒤에만 이미지를 올린다.
  # PR에서는 돌지 않는다. 포크 PR은 OIDC 토큰을 받지 못하므로 어차피 실패한다.
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 액세스 키를 저장하지 않는다. OIDC로 역할을 잠깐 빌린다.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 변수가 아니라 시크릿이다. 변수는 로그에 그대로 찍히지만 시크릿은
      # 마스킹된다. 이 레포가 public 이라 Actions 로그도 공개된다.
      - name: Check role ARN is configured
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          [ -n "$ROLE" ] || {
            echo "::error::AWS_ROLE_ARN 시크릿이 없다. Settings > Secrets and variables > Actions 에서 추가한다."
            exit 1
          }

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ap-northeast-2

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # EC2가 x86_64다. 빌더 아키텍처에 끌려가지 않게 못 박는다.
          platforms: linux/amd64
          # attestation manifest를 만들지 않는다. ECR에 untagged 아티팩트가
          # 쌓여서 라이프사이클 정책과 엇갈린다.
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/codereferee-server:sha-${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/codereferee-server:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 푸시된 이미지" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.ecr.outputs.registry }}/codereferee-server:sha-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.ecr.outputs.registry }}/codereferee-server:${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
