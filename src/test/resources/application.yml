spring:
  profiles:
    include: ""

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

  # JavaMailSender 빈이 컨텍스트 로드 때 생기도록 host만 둔다. report-mail.enabled 기본 false라 실제 발송은 없다.
  mail:
    host: localhost
