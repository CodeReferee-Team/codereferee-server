spring:
  profiles:
    include: secret  # 로컬의 application-secret.yml을 로드 (보안 상 git 제외 대상)

  application:
    name: codereferee-server

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://localhost:5432/codereferee_test
    username: ryu
    password: 1234

  jpa:
    hibernate:
      ddl-auto: none # 추후에 update로 변경
    show-sql: true
    properties:
      hibernate:
        format_sql: true # 로그 가독성 향상

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: prometheus

# 결과가 끝내 도착하지 않은 요청을 ERROR로 확정하는 기준 (StaleValidationSweeper)
codereferee:
  validation:
    sweep-interval: 1m
    queued-timeout: 60m   # 샌드박스가 동시 1건만 처리해 대기열이 길어질 수 있다
    running-timeout: 30m  # AI 측 샌드박스 작업 상한 15~20분보다 여유를 둔다
