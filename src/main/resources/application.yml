spring:
  profiles:
    include: secret  # 로컬의 application-secret.yml을 로드 (보안 상 git 제외 대상)

  application:
    name: codereferee-server

  data:
    redis:
      host: localhost
      port: 6379

  # 리포트 메일 발송용 SMTP. 기본 host를 둬 JavaMailSender 빈이 항상 생기게 한다
  # (없으면 ReportMailSender가 빈을 못 찾아 기동이 깨진다). 실제 발송은 report-mail.enabled로 막는다.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: jdbc:postgresql://localhost:5432/codereferee_test
    username: ryu
    password: 1234

  jpa:
    hibernate:
      ddl-auto: none # 추후에 update로 변경
    show-sql: true
    properties:
      hibernate:
        format_sql: true # 로그 가독성 향상

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # health는 배포 확인과 compose 헬스체크에 쓴다. show-details 기본값이
        # never라 응답은 {"status":"UP"}뿐이고 내부 구성은 드러나지 않는다.
        include: prometheus,health
  health:
    # JavaMailSender 빈은 ReportMailSender 생성을 위해 항상 만들어진다. 그 빈이
    # 있다는 이유만으로 메일 헬스 지표가 localhost:587에 붙으러 가서 전체 상태를
    # DOWN으로 만든다. 발송을 끈 상태에서 SMTP 미설정은 장애가 아니다.
    # 발송 여부와 같은 플래그를 따르게 해서, 실제로 보낼 때만 감시한다.
    mail:
      enabled: ${REPORT_MAIL_ENABLED:false}

# 결과가 끝내 도착하지 않은 요청을 ERROR로 확정하는 기준 (StaleValidationSweeper)
codereferee:
  validation:
    sweep-interval: 1m
    queued-timeout: 60m   # 샌드박스가 동시 1건만 처리해 대기열이 길어질 수 있다
    running-timeout: 30m  # AI 측 샌드박스 작업 상한 15~20분보다 여유를 둔다

# 완료 리포트 메일 발송. SMTP가 설정되지 않은 환경에서는 enabled=false로 꺼둔다.
app:
  report-mail:
    enabled: ${REPORT_MAIL_ENABLED:false}
    from: ${REPORT_MAIL_FROM:CodeReferee <noreply@codereferee.dev>}
    # 로그인이 없어 임의 주소로 보낼 수 있다. 전역 시간당 상한으로 스팸 폭주를 막는다.
    max-per-hour: ${REPORT_MAIL_MAX_PER_HOUR:100}
