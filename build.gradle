plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.codereferee'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

ext['testcontainers.version'] = '1.21.4'
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// 완료 리포트를 메일로 보낸다. 발송은 SMTP(JavaMailSender), 첨부는 서버에서 만든 PDF다.
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	// aiReports → HTML → PDF. 순수 Java라 헤드리스 브라우저 컨테이너가 필요 없다.
	implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	annotationProcessor 'org.projectlombok:lombok'

	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'com.h2database:h2'

	// 직접 postgresql 띄워봄
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.awaitility:awaitility'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootRun') {
	// args 대신 systemProperty를 사용하면 OS 환경과 상관없이 확실하게 설정이 주입됩니다.
	systemProperty 'spring.datasource.url', 'jdbc:postgresql://localhost:5433/codereferee'
	systemProperty 'spring.datasource.username', 'postgres'
	systemProperty 'spring.datasource.password', 'postgres'
	systemProperty 'spring.data.redis.host', 'localhost'
	systemProperty 'spring.data.redis.port', '6379'
}