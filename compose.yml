services:
  codereferee-server:
    build:
      context: .
    image: codereferee-server:latest
    container_name: codereferee-server
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://codereferee-db:5432/codereferee
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: codereferee-redis
      SPRING_DATA_REDIS_PORT: 6379
      # AI 모듈 없이 전 구간을 돌려보려면 mock-ai 프로필이 필요하다. 이게 없으면 요청이
      # input 큐에 그대로 머물러, 대시보드에 제출과 큐 적체만 보이고 판정도 소요시간도 안 나온다.
      #   SPRING_PROFILES_ACTIVE=mock-ai docker compose up -d
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    depends_on:
      codereferee-db:
        condition: service_healthy
      codereferee-redis:
        condition: service_healthy
    networks:
      - codereferee-network

  codereferee-db:
    image: postgres:17-alpine
    container_name: codereferee-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codereferee
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      # ddl-auto: none 이므로 스키마는 수동이다. 빈 데이터 디렉터리로 처음 뜰 때만 실행되어,
      # clone 직후 바로 쓸 수 있게 한다. 이미 데이터가 있으면 postgres가 건너뛴다.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codereferee"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - codereferee-network

  codereferee-redis:
    image: redis:alpine
    container_name: codereferee-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codereferee-network

  prometheus:
    image: prom/prometheus:latest
    container_name: codereferee-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      codereferee-server:
        condition: service_started
    networks:
      - codereferee-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: codereferee-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      # 데이터소스와 대시보드를 코드로 넣는다. UI에서 만들면 컨테이너를 다시 만들 때 사라진다.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - codereferee-network
    restart: unless-stopped

networks:
  codereferee-network:
    driver: bridge
